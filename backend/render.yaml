services:
  - type: web
    name: gold-silver-bot
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gold-silver-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    healthCheckPath: /api/health
    healthCheckTimeout: 300

databases:
  - name: gold-silver-db
    databaseName: gold_silver_bot
    plan: free
