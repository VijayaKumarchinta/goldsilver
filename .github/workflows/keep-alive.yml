name: Keep Render Service Awake

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://goldsilver.onrender.com/api/prices/health)
          echo "Render service responded with status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Render service returned $STATUS"
          fi
