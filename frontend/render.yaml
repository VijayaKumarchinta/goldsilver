# The dashboard is a static SPA. ``dist`` is committed to the repository so
# Render serves it directly; the backend only ever pushes price events over
# Socket.IO and reads historical chart data from PostgreSQL.
services:
  - type: static
    name: gold-silver-dashboard
    plan: free
    buildCommand: npm install && npm run build
    staticDirectory: dist
    envVars:
      - key: VITE_API_BASE
        value: https://goldsilver.onrender.com/api
